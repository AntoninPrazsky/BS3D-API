name: Release

# The build the Pi runs (issue #3), in the shape of BS3D's own release.yml:
#   * a pushed tag "v*" builds, tests, packs and publishes a GitHub Release with the archive and its checksum;
#   * the "Run workflow" button does the same build and keeps the archive as a workflow artifact, publishing nothing.
# The Pi pulls a release with deploy/update.sh. Free: the repository is public.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Name this build
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then version="${{ github.ref_name }}"; else version="dev-${GITHUB_SHA::7}"; fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NAME=BS3D.Api-$version-linux-arm64" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test BS3D.Api.slnx

      # Self-contained: nothing is installed on the Pi, the runtime travels in the folder. Not trimmed and not
      # single-file, for BS3D's reasons: nothing is gained and reflection-heavy code is the thing that would break.
      - name: Publish for linux-arm64
        run: |
          args="-c Release -r linux-arm64 --self-contained true -o publish"
          if [[ "$BUILD_VERSION" =~ ^v([0-9]+(\.[0-9]+){1,3})$ ]]; then args="$args -p:Version=${BASH_REMATCH[1]}"; fi
          dotnet publish src/BS3D.Api/BS3D.Api.csproj $args

      # The scripts and the units travel inside the archive, so what the Pi runs to update, back up and fetch
      # ceilings is always the version it is running
      - name: Pack
        run: |
          mkdir -p publish/deploy
          cp deploy/* publish/deploy/
          chmod +x publish/BS3D.Api publish/deploy/*.sh
          test -f publish/libcoreclr.so || { echo "not a self-contained publish"; exit 1; }
          tar -czf "$BUILD_NAME.tar.gz" -C publish .
          sha256sum "$BUILD_NAME.tar.gz" > "$BUILD_NAME.tar.gz.sha256"
          ls -la "$BUILD_NAME".tar.gz*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}
          path: |
            ${{ env.BUILD_NAME }}.tar.gz
            ${{ env.BUILD_NAME }}.tar.gz.sha256
          retention-days: 30

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$BUILD_VERSION" "$BUILD_NAME.tar.gz" "$BUILD_NAME.tar.gz.sha256" --title "BS3D.Api $BUILD_VERSION" --generate-notes
