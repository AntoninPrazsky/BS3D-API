name: Build

# Every push, like BS3D's own build.yml: this repository has no pull requests either, so a push is how a merge
# into main lands. Linux, because the service runs on linux-arm64 (a Raspberry Pi 5, issue #3) and nothing in it
# is Windows-only. Free: the repository is public.
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build BS3D.Api.slnx

      - name: Test
        run: dotnet test BS3D.Api.slnx --no-build

      # What root runs on the Pi (issues #3, #4, #5, #6): every script through shellcheck, and the tunnel-token script,
      # the admin page's launcher, the update, the firewall, the backup card's setup and the copy off the site's against
      # stand-ins. The firewall's test checks its rules with the real nft, in a network namespace of its own, so the
      # runner's own firewall is never touched; the backup's mounts a tmpfs as the card, in a mount namespace of its own,
      # and sends the copy off the site with the real restic to the real sftp-server, over a stand-in for ssh.
      - name: Deploy scripts
        run: |
          command -v nft > /dev/null || sudo apt-get install -y -qq nftables > /dev/null
          command -v restic > /dev/null || sudo apt-get install -y -qq restic > /dev/null
          [ -x /usr/lib/openssh/sftp-server ] || sudo apt-get install -y -qq openssh-sftp-server > /dev/null
          shellcheck deploy/*.sh tests/deploy/*.sh
          sudo tests/deploy/tunnel-token.test.sh
          sudo tests/deploy/install-admin.test.sh
          sudo tests/deploy/update.test.sh
          sudo tests/deploy/firewall.test.sh
          sudo tests/deploy/backup.test.sh
          sudo tests/deploy/backup-card.test.sh
          sudo tests/deploy/backup-offsite.test.sh

      # The target the Pi runs, published on every push so a change that breaks it is caught here and not on the box
      - name: Publish for linux-arm64
        run: dotnet publish src/BS3D.Api/BS3D.Api.csproj -c Release -r linux-arm64 --self-contained true -o publish
