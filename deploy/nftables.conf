#!/usr/sbin/nft -f
# The Pi's own firewall (issue #4, item 5), written to /etc/nftables.conf by deploy/firewall.sh, which fills in the home
# network's prefixes below (written LAN4 and LAN6 between at signs, which is why this line spells them out). Inbound:
# what the Pi serves the home network, and the answers to what it asked for itself (the tunnel, updates, DHCP).
# Nothing is forwarded; outbound is free.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state invalid drop
		ct state established,related accept
		# Ping, and IPv6's neighbour discovery, router advertisements and path MTU
		meta l4proto { icmp, ipv6-icmp } accept
		# DHCP and DHCPv6 answers, which are not tracked as answers
		udp dport { 68, 546 } accept
		# SSH and VNC from the home network: its IPv4 prefix, IPv6 link-local and its IPv6 prefix
		ip saddr @LAN4@ tcp dport { 22, 5900 } accept
		ip6 saddr @LAN6@ tcp dport { 22, 5900 } accept
		# mDNS, which answers for BS3DServer.local
		ip saddr @LAN4@ udp dport 5353 accept
		ip6 saddr @LAN6@ udp dport 5353 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
